name: Build Native Android Apps

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "README-ANDROID.md"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile native Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build existing DJS native app
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Build Panel La Chamba native app
        run: gradle --no-daemon --stacktrace -p android :panel:assembleDebug

      - name: Verify both APKs
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/panel/build/outputs/apk/debug/panel-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/panel/build/outputs/apk/debug/panel-debug.apk
          if grep -R "android.webkit.WebView" android/panel/src/main/java; then
            echo "WebView code found in native Panel La Chamba app."
            exit 1
          fi

      - name: Upload Panel La Chamba native APK
        uses: actions/upload-artifact@v4
        with:
          name: PANEL-LA-CHAMBA-Native-Android-APK
          path: android/panel/build/outputs/apk/debug/panel-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload DJS audio native APK
        uses: actions/upload-artifact@v4
        with:
          name: DJS-DE-LA-CHAMBA-Native-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
