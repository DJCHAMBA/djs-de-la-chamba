name: Build DJS DE LA CHAMBA Native Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "README-ANDROID.md"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build native debug APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Build native Panel La Chamba APK\n        run: gradle --no-daemon --stacktrace -p android :panel:assembleDebug\n\n      - name: Build native Panel La Chamba APK
        run: gradle --no-daemon --stacktrace -p android :panel:assembleDebug

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk\n          test -s android/panel/build/outputs/apk/debug/panel-debug.apk\n          ls -lh android/panel/build/outputs/apk/debug/panel-debug.apk
          if grep -R "android.webkit.WebView" android/app/src/main/java; then
            echo "WebView code found in native app source."
            exit 1
          fi

      - name: Upload Panel La Chamba native APK\n        uses: actions/upload-artifact@v4\n        with:\n          name: PANEL-LA-CHAMBA-Native-Android-APK\n          path: android/panel/build/outputs/apk/debug/panel-debug.apk\n          if-no-files-found: error\n          retention-days: 30\n\n      - name: Verify Panel La Chamba APK
        run: |
          test -s android/panel/build/outputs/apk/debug/panel-debug.apk
          ls -lh android/panel/build/outputs/apk/debug/panel-debug.apk

      - name: Upload Panel La Chamba native APK
        uses: actions/upload-artifact@v4
        with:
          name: PANEL-LA-CHAMBA-Native-Android-APK
          path: android/panel/build/outputs/apk/debug/panel-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: DJS-DE-LA-CHAMBA-Native-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
