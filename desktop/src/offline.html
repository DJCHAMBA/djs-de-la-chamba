<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJS DE LA CHAMBA - Sin conexión</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#090a0d;color:#f5f6f8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(700px 360px at 50% -150px,#0a84ff2d,transparent 70%),#090a0d}
main{width:min(560px,calc(100% - 36px));padding:42px;border:1px solid #303640;border-radius:24px;background:#171a20;text-align:center;box-shadow:0 24px 70px #0008}
.logo{width:86px;height:86px;margin:0 auto 20px;border-radius:24px;background:#0c1930;display:grid;place-items:center;font-size:42px;box-shadow:0 8px 32px #0a84ff28}
h1{font-size:25px;margin:0 0 10px;letter-spacing:-.6px}
p{color:#aab2bf;line-height:1.6;margin:0 0 24px}
button{border:0;border-radius:12px;background:#0a84ff;color:white;font-size:15px;font-weight:700;padding:13px 22px;cursor:pointer}
small{display:block;color:#747e8d;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="logo">🎧</div>
<h1>DJS DE LA CHAMBA</h1>
<p>No pude conectar con el estudio de audio. Comprueba tu conexión a internet y vuelve a intentarlo.</p>
<button onclick="location.href='https://djchamba.github.io/djs-de-la-chamba/'">Volver a intentar</button>
<small>La aplicación necesita internet para cargar tu espacio de trabajo.</small>
</main>
</body>
</html>
